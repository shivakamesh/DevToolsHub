    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" /></noscript>
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/tools.css" />
    <link rel="stylesheet" href="css/minimal.css" />
    <script>
        window.devTheme = {
            get: () => localStorage.getItem('theme') || 'dark',
            set: t => { localStorage.setItem('theme', t); document.documentElement.dataset.theme = t; }
        };
        document.documentElement.dataset.theme = window.devTheme.get();
        document.addEventListener('DOMContentLoaded', function () {
            if (document.querySelector('link[rel=canonical]')) return;
            var path
            var link = document.createElement('link');
            link.rel = 'canonical';
            link.id = 'static-canonical';
            link.href = 'https://www.itsalldevtools.com' + path;
            document.head.appendChild(link);
        });
    </script>
</head>

<body>
    <div id="app"></div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">âœ•</a>
    </div>
    <script src="js/site.js" defer></script>
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "b6f3e467ae89404282beba5b41ef3630"}'></script>
    <script>
        (function () {
            var started = false;
            var events = ['pointerdown', 'pointermove', 'keydown', 'touchstart', 'scroll', 'focusin'];
            function start() {
                if (started) return;
                started = true;
                events.forEach(function (e) { window.removeEventListener(e, start, true); });
                var s = document.createElement('script');
                s.src = '_framework/blazor.webassembly.js';
                s.setAttribute('autostart', 'false');
                s.onload = function () {
                    Blazor.start().then(function () {
                        var c = document.getElementById('static-canonical');
                        if (c && document.querySelectorAll('link[rel=canonical]').length > 1) c.remove();
                    });
                };
                document.body.appendChild(s);
            }
            if (/bot|crawl|spider|slurp|lighthouse|headless/i.test(navigator.userAgent)) { start(); return; }
            events.forEach(function (e) { window.addEventListener(e, start, { capture: true, passive: true }); });
            window.addEventListener('load', function () { setTimeout(start, 4000); });
        })();
    </script>
</body>

</html>
