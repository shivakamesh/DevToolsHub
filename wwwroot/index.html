<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevToolsHub - Free Online Developer Tools</title>
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="description" content="Free developer tools: JSON formatter, regex tester, cron explainer, Base64, JWT decoder, hash, GUID and password generators. 100% in your browser." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DevToolsHub" />
    <meta property="og:title" content="DevToolsHub - Free Online Developer Tools" />
    <meta property="og:description" content="Free developer tools that run 100% in your browser. Nothing is uploaded." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="theme-color" content="#0b1020" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/tools.css" />
    <script>
        window.devTheme = {
            get: () => localStorage.getItem('theme') || 'dark',
            set: t => { localStorage.setItem('theme', t); document.documentElement.dataset.theme = t; }
        };
        document.documentElement.dataset.theme = window.devTheme.get();
    </script>
</head>

<body>
    <div id="app">
        <div class="splash">
            <img class="logo big" src="logo.svg" alt="DevToolsHub" />
            <svg class="loading-progress">
                <circle r="40%" cx="50%" cy="50%" />
                <circle r="40%" cx="50%" cy="50%" />
            </svg>
            <div class="loading-progress-text"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">âœ•</a>
    </div>
    <script src="js/site.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
